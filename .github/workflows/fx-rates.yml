name: Daily FX Rates

on:
  schedule:
    - cron: '0 6 * * *'  # 7:00 AM BST / 8:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fx-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and commit FX rates
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os

          url = "https://api.frankfurter.app/latest?from=EUR&to=GBP,USD"
          with urllib.request.urlopen(url, timeout=10) as r:
              data = json.loads(r.read())

          date  = data["date"]
          gbp   = round(1 / data["rates"]["GBP"], 4)
          usd   = round(1 / data["rates"]["USD"], 4)

          # JS file for cashflow dashboard
          js = f"""// FX rates — written daily by GitHub Actions
// EUR as base: how many EUR per 1 unit of foreign currency
window.FX_RATES = {{
  GBP: {gbp},
  USD: {usd},
  date: "{date}",
  source: "live"
}};"""
          with open("fx-rates.js", "w") as f:
              f.write(js)

          # JSON file for API / script access
          with open("fx-rates.json", "w") as f:
              json.dump({"GBP": gbp, "USD": usd, "date": date, "source": "live"}, f, indent=2)

          print(f"GBP={gbp}  USD={usd}  date={date}")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fx-rates.js fx-rates.json
          git diff --staged --quiet || git commit -m "chore: fx rates $(date -u +%Y-%m-%d)"
          git push
