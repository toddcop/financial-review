name: Daily FX Rates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fx-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and commit FX rates
        run: python3 update_fx_rates.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fx-rates.js fx-rates.json
          git diff --staged --quiet || git commit -m "chore: fx rates $(date -u +%Y-%m-%d)"
          git push
